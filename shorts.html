<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JioVibe Shorts</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#FFF6ED;color:#4A0E0E;overflow:hidden}
a{text-decoration:none;color:inherit}
button,input{font-family:inherit}
button{border:none;background:none;cursor:pointer;color:inherit}

.app{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
width:250px;
height:100vh;
border-right:1px solid #FFD2B3;
padding:32px 18px;
background:#FFFFFF;
z-index:10
}
.logo{display:flex;align-items:center;gap:4px;margin-bottom:45px;padding-left:8px}
.logo-circle{
width:54px;height:54px;background:#FF7A00;color:#FFFFFF;border-radius:50%;
display:flex;align-items:center;justify-content:center;font-weight:800;font-size:25px
}
.logo-text{font-size:32px;font-weight:800;color:#4A0E0E;letter-spacing:-1.2px}
.menu{display:flex;flex-direction:column;gap:12px}
.menu-item{
display:flex;align-items:center;gap:18px;padding:17px 22px;border-radius:14px;
font-weight:600;color:#7A3E2E;font-size:16px;transition:.25s
}
.menu-item i{width:22px;font-size:22px;text-align:center}
.menu-item:hover{background:#FFE4CC;color:#FF7A00}
.menu-item.active{background:#FF7A00;color:#FFFFFF}

/* MAIN */
.main{flex:1;height:100vh;display:flex;flex-direction:column}
.topbar{
height:94px;
border-bottom:1px solid #FFD2B3;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 48px;
background:#FFFFFF;
position:sticky;
top:0;
z-index:8
}
.search{
width:600px;
height:50px;
border:1px solid #FFD2B3;
border-radius:28px;
display:flex;
align-items:center;
gap:16px;
padding:0 22px;
color:#A66A55;
background:#FFFFFF
}
.search input{border:none;outline:none;flex:1;font-size:15px;background:transparent}
.top-actions{display:flex;align-items:center;gap:22px;position:relative}
.bell{
font-size:23px;
position:relative;
cursor:pointer;
}

.bell::after{
content:"1";
position:absolute;
top:-8px;
right:-7px;
background:#FF7A00;
color:#FFFFFF;
font-size:10px;
width:17px;
height:17px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

.profile{
display:flex;
align-items:center;
gap:12px;
cursor:pointer;
padding:8px;
border-radius:18px;
}

.profile img{
width:48px;
height:48px;
border-radius:50%;
object-fit:cover;
}

.profile span{
font-weight:700;
font-size:15px;
}

.dropdown{
position:absolute;
top:70px;
right:0;
width:200px;
background:#FFFFFF;
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
display:none;
overflow:hidden;
z-index:20;
}

.dropdown a{
display:block;
padding:14px;
font-weight:600;
color:#4A0E0E;
}

.dropdown a:hover{
background:#FFE4CC;
color:#2A0A0A;
}

.dropdown.show{display:block;}

/* FEED */
.feed-home{
flex:1;
overflow-y:auto;
padding:28px 34px 50px;
background:#FFF6ED
}
.feed-title{margin-bottom:22px}
.feed-title h1{font-size:30px;font-weight:900}
.feed-title p{color:#7A3E2E;font-weight:700;margin-top:5px}

.feed-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:18px
}
.feed-card{
width:100%;
aspect-ratio:9/16;
border-radius:20px;
overflow:hidden;
position:relative;
background:#2A0A0A;
cursor:pointer;
box-shadow:0 10px 28px rgba(74,14,14,.10);
transition:.25s
}
.feed-card:hover{
box-shadow:0 18px 40px rgba(74,14,14,.16)
}
.feed-card img{
width:100%;
height:100%;
object-fit:cover;
display:block
}
.feed-card:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(180deg,rgba(42,10,10,.02),rgba(42,10,10,.72))
}
.feed-card .views{
position:absolute;
top:12px;
left:12px;
background:rgba(42,10,10,.60);
color:#FFFFFF;
padding:7px 10px;
border-radius:9px;
font-size:12px;
font-weight:900;
z-index:2
}
.feed-card .feed-info{
position:absolute;
left:14px;
right:14px;
bottom:14px;
color:#FFFFFF;
z-index:2
}
.feed-info h3{
font-size:15px;
line-height:1.35;
margin-bottom:7px;
font-weight:900
}
.feed-info p{
font-size:12px;
color:#FFE0CC;
font-weight:700
}

/* PLAYER */
.player-mode{
position:fixed;
inset:0;
background:#FFF6ED;
z-index:60;
display:none
}
.player-mode.show{display:block}

.close-player{
position:fixed;
top:22px;
right:28px;
width:48px;
height:48px;
border-radius:50%;
background:#FFFFFF;
color:#FF7A00;
box-shadow:0 8px 28px rgba(74,14,14,.15);
z-index:90;
font-size:22px
}

.short-scroll{
height:100vh;
overflow-y:auto;
scroll-snap-type:y mandatory;
scroll-behavior:smooth;
scrollbar-width:none;
display:flex;
flex-direction:column;
align-items:center;
padding:18px 0
}
.short-scroll::-webkit-scrollbar{display:none}

.short-item{
height:100vh;
width:720px;
max-width:96vw;
position:relative;
scroll-snap-align:start;
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0
}

.phone{
height:calc(100vh - 36px);
aspect-ratio:9/16;
max-height:940px;
border-radius:24px;
overflow:hidden;
position:relative;
background:#2A0A0A;
box-shadow:0 24px 55px rgba(74,14,14,.20)
}
.phone img{
width:100%;
height:100%;
object-fit:cover;
display:block
}
.phone::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(180deg,rgba(42,10,10,.02),rgba(42,10,10,.06) 45%,rgba(42,10,10,.72));
pointer-events:none
}
.mute{
position:absolute;
top:18px;
right:18px;
width:44px;
height:44px;
background:rgba(42,10,10,.45);
color:#FFFFFF;
border-radius:50%;
z-index:3;
font-size:18px
}

.short-info{
position:absolute;
left:24px;
right:24px;
bottom:38px;
z-index:4;
color:#FFFFFF
}
.creator-line{
display:flex;
align-items:center;
gap:10px;
margin-bottom:16px
}
.creator-line img{
width:42px;
height:42px;
border-radius:50%;
object-fit:cover;
border:2px solid #FFFFFF
}
.creator-line b{font-size:15px}
.verify{color:#FF7A00}
.follow-btn{
margin-left:auto;
border:1px solid #FF7A00;
background:rgba(42,10,10,.25);
color:#FFFFFF;
border-radius:20px;
padding:9px 18px;
font-weight:900
}
.follow-btn.following{
background:#FFFFFF;
color:#4A0E0E;
border-color:#FFFFFF
}
.caption{font-size:15px;line-height:1.5;margin-bottom:8px;font-weight:800}
.tags{font-size:14px;font-weight:900;color:#FF7A00}

.short-progress{
position:absolute;
left:24px;
right:24px;
bottom:22px;
height:4px;
background:rgba(255,255,255,.35);
border-radius:10px;
z-index:4
}
.short-progress span{
display:block;
height:100%;
width:40%;
background:#FF7A00;
border-radius:10px
}
.time{
position:absolute;
right:24px;
bottom:10px;
color:#FFFFFF;
font-size:13px;
font-weight:800;
z-index:4
}

/* ACTION BUTTONS */
.actions{
position:absolute;
right:0;
transform:translateX(88px);
top:50%;
margin-top:-150px;
display:flex;
flex-direction:column;
gap:18px
}
.action{
width:66px;
min-height:66px;
border-radius:14px;
background:#FFFFFF;
box-shadow:0 8px 28px rgba(74,14,14,.10);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:6px;
font-weight:900;
color:#7A3E2E
}
.action i{font-size:24px}
.action span{font-size:12px}
.action:hover{background:#FFE4CC;color:#FF7A00}
.action.liked{background:#FF7A00;color:#FFFFFF}

.more-menu{
display:none;
position:absolute;
right:-250px;
top:70%;
width:220px;
background:#FFFFFF;
border:1px solid #FFD2B3;
border-radius:16px;
box-shadow:0 10px 30px rgba(74,14,14,.16);
z-index:30;
overflow:hidden
}
.more-menu.show{display:block}
.more-menu div{
padding:14px 16px;
font-size:14px;
font-weight:800;
cursor:pointer
}
.more-menu div:hover{
background:#FFE4CC;
color:#FF7A00
}

/* COMMENT PANEL FIXED */
.comment-panel{
position:fixed;
right:36px;
top:50%;
transform:translateY(-50%);
width:390px;
height:560px;
background:#FFFFFF;
border:1px solid #FFD2B3;
border-radius:20px;
box-shadow:0 24px 60px rgba(74,14,14,.20);
z-index:130;
display:none;
flex-direction:column;
overflow:hidden
}
.comment-panel.show{display:flex}
.comment-head{
height:60px;
border-bottom:1px solid #FFD2B3;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
flex-shrink:0
}
.comment-head h3{font-size:18px;font-weight:900}
.comment-list{
flex:1;
overflow:auto;
padding:16px;
display:flex;
flex-direction:column;
gap:14px
}
.comment{
display:grid;
grid-template-columns:38px 1fr;
gap:10px
}
.comment img{
width:36px;
height:36px;
border-radius:50%;
object-fit:cover
}
.comment h4{font-size:13px;font-weight:900}
.comment p{font-size:13px;color:#7A3E2E;font-weight:600;margin-top:3px}
.comment-input{
border-top:1px solid #FFD2B3;
padding:12px;
display:flex;
gap:8px;
flex-shrink:0
}
.comment-input input{
flex:1;
height:42px;
border:1px solid #FFD2B3;
border-radius:22px;
padding:0 14px;
outline:none;
font-weight:700
}
.send{
width:42px;
height:42px;
border-radius:50%;
background:#FF7A00;
color:#FFFFFF;
font-size:16px
}

/* SHARE MODAL */
.modal-bg{
position:fixed;
inset:0;
background:rgba(42,10,10,.45);
display:none;
align-items:center;
justify-content:center;
z-index:140
}
.modal-bg.show{display:flex}
.modal{
background:#FFFFFF;
width:420px;
border-radius:20px;
padding:24px;
box-shadow:0 15px 45px rgba(42,10,10,.25)
}
.modal h2{margin-bottom:18px;font-size:22px;font-weight:900}
.close{
margin-top:18px;
width:100%;
height:46px;
border-radius:12px;
background:#FFE4CC;
font-weight:900
}
.share-icons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px
}
.share-icon{
text-align:center;
font-size:13px;
font-weight:800;
cursor:pointer
}
.share-icon i{
width:54px;
height:54px;
border-radius:50%;
background:#FFE4CC;
color:#FF7A00;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
margin:0 auto 8px
}

.toast{
position:fixed;
top:24px;
left:50%;
transform:translateX(-50%) translateY(-20px);
background:#4A0E0E;
color:#FFFFFF;
padding:13px 18px;
border-radius:12px;
font-weight:900;
opacity:0;
transition:.25s;
z-index:200
}
.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0)
}

@media(max-width:1200px){
.feed-grid{grid-template-columns:repeat(4,1fr)}
.search{width:420px}
}
@media(max-width:1000px){
.sidebar{width:220px}
.feed-grid{grid-template-columns:repeat(3,1fr)}
.actions{transform:translateX(78px)}
}
@media(max-width:780px){
.sidebar{display:none}
.topbar{padding:0 16px}
.profile span{display:none}
.search{width:100%}
.feed-home{padding:20px}
.feed-grid{grid-template-columns:repeat(2,1fr);gap:14px}
.short-item{width:100%;height:100vh;max-width:100%}
.phone{width:100%;height:100%;border-radius:0;max-height:none}
.actions{right:16px;top:auto;bottom:120px;transform:none;margin-top:0;z-index:5}
.action{background:rgba(255,255,255,.92)}
.close-player{top:18px;right:18px}
.comment-panel{right:14px;left:14px;top:50%;width:auto}
.more-menu{right:20px;top:auto;bottom:105px}
}

/* --- ADDED PREMIUM ANIMATIONS ONLY --- */

/* Sidebar hover animation */
.menu-item{
transition:background .25s ease,color .25s ease,transform .25s ease,box-shadow .25s ease;
transform-origin:left center;
}
.menu-item:hover{
transform:scale(1.045);
box-shadow:0 10px 24px rgba(255,122,0,0.14);
}

/* Top profile, notification and dropdown polish */
.bell,
.profile,
.dropdown a{
transition:transform .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease;
}
.bell:hover,
.profile:hover{
transform:scale(1.05);
}
.profile:hover{
background:#FFF6ED;
box-shadow:0 8px 22px rgba(74,14,14,.08);
}

/* Shorts grid card hover */
.feed-card{
transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease;
will-change:transform;
}
.feed-card:hover{
transform:translateY(-8px) scale(1.035);
box-shadow:0 22px 46px rgba(74,14,14,.18);
}
.feed-card img{
transition:transform .4s ease;
}
.feed-card:hover img{
transform:scale(1.08);
}

/* Full-screen phone/player animation */
.phone{
transition:transform .35s ease,box-shadow .35s ease;
will-change:transform;
}
.phone:hover{
transform:scale(1.015);
box-shadow:0 30px 70px rgba(74,14,14,.26);
}
.phone img{
transition:transform .45s ease;
}
.phone:hover img{
transform:scale(1.035);
}

/* Action buttons */
.action{
transition:transform .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease;
}
.action:hover{
transform:translateY(-4px) scale(1.06);
box-shadow:0 14px 32px rgba(74,14,14,.18);
}

/* Follow, mute, close buttons */
.follow-btn,
.mute,
.close-player,
.send,
.close,
.share-icon i{
transition:transform .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease;
}
.follow-btn:hover,
.mute:hover,
.close-player:hover,
.send:hover,
.close:hover{
transform:scale(1.06);
box-shadow:0 12px 28px rgba(74,14,14,.14);
}

/* Comment panel animation */
.comment-panel.show{
animation:panelIn .28s ease both;
}
@keyframes panelIn{
from{opacity:0;transform:translateY(-50%) translateX(18px) scale(.98);}
to{opacity:1;transform:translateY(-50%) translateX(0) scale(1);}
}
.comment{
transition:transform .25s ease,background .25s ease;
}
.comment:hover{
transform:translateY(-3px) scale(1.01);
}

/* More menu smooth entry */
.more-menu.show{
animation:menuPop .22s ease both;
}
@keyframes menuPop{
from{opacity:0;transform:translateY(8px) scale(.96);}
to{opacity:1;transform:translateY(0) scale(1);}
}

/* Share modal animation */
.modal-bg.show .modal{
animation:modalPop .28s ease both;
}
@keyframes modalPop{
from{opacity:0;transform:translateY(18px) scale(.96);}
to{opacity:1;transform:translateY(0) scale(1);}
}
.share-icon{
transition:transform .25s ease,color .25s ease;
}
.share-icon:hover{
transform:translateY(-5px);
}
.share-icon:hover i{
transform:scale(1.08);
box-shadow:0 12px 26px rgba(255,122,0,.20);
}

/* Feed content entry */
.feed-title,
.feed-grid{
animation:softFadeUp .45s ease both;
}
.feed-grid{
animation-delay:.08s;
}
@keyframes softFadeUp{
from{opacity:0;transform:translateY(12px);}
to{opacity:1;transform:translateY(0);}
}

/* Player mode entry */
.player-mode.show .short-item:first-child .phone,
.player-mode.show .short-item:first-child .actions{
animation:softFadeUp .35s ease both;
}

/* Respect reduced motion */
@media (prefers-reduced-motion: reduce){
*{
animation:none !important;
transition:none !important;
}
}

</style>
</head>

<body>

<div class="toast" id="toast">Done</div>

<div class="app">

<aside class="sidebar">
<a href="home.html" class="logo">
<div class="logo-circle">Jio</div>
<div class="logo-text">Vibe</div>
</a>

<nav class="menu">
<a href="home.html" class="menu-item"><i class="fa-solid fa-house"></i> Home</a>
<a href="explore.html" class="menu-item"><i class="fa-regular fa-compass"></i> Explore</a>
<a href="live.html" class="menu-item"><i class="fa-solid fa-tower-broadcast"></i> Live</a>
<a href="video.html" class="menu-item"><i class="fa-regular fa-circle-play"></i> Video</a>
<a href="shorts.html" class="menu-item active"><i class="fa-solid fa-bolt"></i> Shorts</a>
<a href="subscriptions.html" class="menu-item"><i class="fa-solid fa-list"></i> Subscriptions</a>
<a href="history.html" class="menu-item"><i class="fa-solid fa-clock"></i> Library</a>
</nav>
</aside>

<main class="main">

<header class="topbar">
<div class="search">
<i class="fa-solid fa-magnifying-glass"></i>
<input placeholder="Search creators, videos, music..." />
</div>

<div class="top-actions">
<a href="notifications.html" class="bell"><i class="fa-regular fa-bell"></i></a>

<div class="profile" onclick="toggleDropdown()">
<img src="https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/Trupti.jpeg">
<span>Trupti Latur</span>
<i class="fa-solid fa-chevron-down"></i>
</div>

<div class="dropdown" id="dropdown">
<a href="home.html">Home</a>
<a href="index.html">Dashboard</a>
<a href="logout.html">Sign out</a>
</div>
</div>
</header>

<section class="feed-home" id="feedHome">
<div class="feed-title">
<h1>Shorts</h1>
<p>Tap any short to open full-screen reel view</p>
</div>

<div class="feed-grid" id="feedGrid"></div>
</section>

</main>
</div>

<!-- FULL SCREEN SHORT PLAYER -->
<div class="player-mode" id="playerMode">
<button class="close-player" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
<div class="short-scroll" id="shortScroll"></div>
</div>

<!-- COMMENT PANEL -->
<div class="comment-panel" id="commentPanel">
<div class="comment-head">
<h3>Comments</h3>
<button onclick="closeComments()"><i class="fa-solid fa-xmark"></i></button>
</div>

<div class="comment-list" id="commentList"></div>

<div class="comment-input">
<input id="commentInput" placeholder="Add a comment...">
<button class="send" onclick="sendComment()"><i class="fa-solid fa-paper-plane"></i></button>
</div>
</div>

<!-- SHARE MODAL -->
<div class="modal-bg" id="shareModal">
<div class="modal">
<h2>Share Short</h2>

<div class="share-icons">
<div class="share-icon" onclick="shareToast('WhatsApp')"><i class="fa-brands fa-whatsapp"></i>WhatsApp</div>
<div class="share-icon" onclick="shareToast('Instagram')"><i class="fa-brands fa-instagram"></i>Instagram</div>
<div class="share-icon" onclick="shareToast('Facebook')"><i class="fa-brands fa-facebook"></i>Facebook</div>
<div class="share-icon" onclick="shareToast('Twitter')"><i class="fa-brands fa-x-twitter"></i>Twitter</div>
<div class="share-icon" onclick="shareToast('Telegram')"><i class="fa-brands fa-telegram"></i>Telegram</div>
<div class="share-icon" onclick="copyLink()"><i class="fa-solid fa-link"></i>Copy Link</div>
<div class="share-icon" onclick="shareToast('Email')"><i class="fa-solid fa-envelope"></i>Email</div>
<div class="share-icon" onclick="nativeShare()"><i class="fa-solid fa-ellipsis"></i>More</div>
</div>

<button class="close" onclick="closeModal('shareModal')">Close</button>
</div>
</div>

<script>
function toggleDropdown(){
document.getElementById("dropdown").classList.toggle("show");
}

document.addEventListener("click",function(e){
if(!e.target.closest(".profile")){
document.getElementById("dropdown").classList.remove("show");
}
});

const shortsData = [
{
gif:"https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/S%20Narendra%20Modi.gif",
creator:"Narendra Modi",
avatar:"https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/PP%20Narendra%20Modi.jpeg",
caption:"Major event moments in seconds",
tags:"#Modi #India #Shorts",
likes:"42.5K", comments:"1.2K", shares:"2.1K", views:"1.4M"
},
{
gif:"https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/S%20Rohit%20Sharma.gif",
creator:"Rohit Sharma",
avatar:"https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/PP%20Rohit%20Sharma.jpg",
caption:"Captain energy and cricket vibes",
tags:"#RohitSharma #Cricket #Sports",
likes:"32.1K", comments:"920", shares:"1.4K", views:"980K"

let feedMultiplier = 4;

function renderFeed(){
const grid = document.getElementById("feedGrid");
grid.innerHTML = "";

for(let round=0; round<feedMultiplier; round++){
shortsData.forEach((item,index)=>{
const card = document.createElement("div");
card.className = "feed-card";
card.onclick = () => openPlayer(index);
card.innerHTML = `
<img src="${item.gif}">
<span class="views"><i class="fa-solid fa-play"></i> ${item.views}</span>
<div class="feed-info">
<h3>${item.caption}</h3>
<p>${item.creator}</p>
</div>
`;
grid.appendChild(card);
});
}
}

function createShortItem(item,index){
const wrap = document.createElement("div");
wrap.className = "short-item";

wrap.innerHTML = `
<div class="phone">
<img src="${item.gif}">
<button class="mute" onclick="toggleMute(this)"><i class="fa-solid fa-volume-xmark"></i></button>

<div class="short-info">
<div class="creator-line">
<img src="${item.avatar}">
<b>${item.creator} <span class="verify"><i class="fa-solid fa-certificate"></i></span></b>
<button class="follow-btn" onclick="toggleFollow(this)">Subscribe</button>
</div>
<div class="caption">${item.caption}</div>
<div class="tags">${item.tags}</div>
</div>

<div class="short-progress"><span style="width:${35 + (index % 5) * 10}%"></span></div>
<div class="time">00:${String(8 + (index % 15)).padStart(2,"0")} / 00:25</div>
</div>

<div class="actions">
<button class="action like" onclick="toggleLike(this)"><i class="fa-solid fa-heart"></i><span>${item.likes}</span></button>
<button class="action" onclick="openComments()"><i class="fa-regular fa-comment-dots"></i><span>${item.comments}</span></button>
<button class="action" onclick="openModal('shareModal')"><i class="fa-solid fa-share"></i><span>${item.shares}</span></button>
<button class="action" onclick="toggleMoreMenu(this)"><i class="fa-solid fa-ellipsis"></i></button>
</div>

<div class="more-menu">
<div onclick="showToast('Short saved')"><i class="fa-regular fa-bookmark"></i> Save short</div>
<div onclick="showToast('Added to playlist')"><i class="fa-solid fa-list"></i> Add to playlist</div>
<div onclick="showToast('Marked as not interested')"><i class="fa-regular fa-eye-slash"></i> Not interested</div>
<div onclick="showToast('Report submitted')"><i class="fa-regular fa-flag"></i> Report</div>
</div>
`;

return wrap;
}

function openPlayer(index){
const player = document.getElementById("playerMode");
const scroll = document.getElementById("shortScroll");
scroll.innerHTML = "";

let playerList = [];
for(let i=0;i<40;i++){
playerList.push(shortsData[(index+i)%shortsData.length]);
}

playerList.forEach((item,i)=>{
scroll.appendChild(createShortItem(item,i));
});

player.classList.add("show");

setTimeout(()=>{
scroll.scrollTop = 0;
},50);
}

function closePlayer(){
document.getElementById("playerMode").classList.remove("show");
document.getElementById("shortScroll").innerHTML = "";
closeComments();
closeModal("shareModal");
}

function toggleLike(btn){
btn.classList.toggle("liked");
const span = btn.querySelector("span");
if(!btn.dataset.base) btn.dataset.base = span.innerText;
span.innerText = btn.classList.contains("liked") ? "Liked" : btn.dataset.base;
}

function toggleFollow(btn){
btn.classList.toggle("following");
btn.innerText = btn.classList.contains("following") ? "Subscribed" : "Subscribe";
}

function toggleMute(btn){
const icon = btn.querySelector("i");
icon.classList.toggle("fa-volume-xmark");
icon.classList.toggle("fa-volume-high");
showToast(icon.classList.contains("fa-volume-high") ? "Unmuted" : "Muted");
}

function toggleMoreMenu(btn){
const menu = btn.closest(".short-item").querySelector(".more-menu");
document.querySelectorAll(".more-menu").forEach(m=>{
if(m !== menu) m.classList.remove("show");
});
menu.classList.toggle("show");
}

document.getElementById("feedHome").addEventListener("scroll", function(){
if(this.scrollTop + this.clientHeight >= this.scrollHeight - 300){
feedMultiplier++;
renderFeed();
}
});

document.getElementById("shortScroll").addEventListener("scroll", function(){
if(this.scrollTop + this.clientHeight >= this.scrollHeight - 500){
for(let i=0;i<8;i++){
const item = shortsData[Math.floor(Math.random()*shortsData.length)];
this.appendChild(createShortItem(item,this.children.length));
}
}
});

document.addEventListener("click",function(e){
if(!e.target.closest(".action") && !e.target.closest(".more-menu")){
document.querySelectorAll(".more-menu").forEach(m=>m.classList.remove("show"));
}
});

function openComments(){
renderComments();
document.getElementById("commentPanel").classList.add("show");
}

function closeComments(){
document.getElementById("commentPanel").classList.remove("show");
}

function renderComments(){
const comments = [
["Rohan","This is so good 🔥","https://i.pravatar.cc/80?img=11"],
["Priya","Vibe is perfect","https://i.pravatar.cc/80?img=18"],
["Amit","Watched it 5 times already","https://i.pravatar.cc/80?img=24"],
["Mumbai Vibes","JioVibe shorts look clean","https://i.pravatar.cc/80?img=32"]
];

document.getElementById("commentList").innerHTML = comments.map(c=>`
<div class="comment">
<img src="${c[2]}">
<div><h4>${c[0]}</h4><p>${c[1]}</p></div>
</div>
`).join("");
}

function sendComment(){
const input = document.getElementById("commentInput");
if(input.value.trim() === "") return;

const list = document.getElementById("commentList");
const div = document.createElement("div");
div.className = "comment";
div.innerHTML = `
<img src="https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/Trupti.jpeg">
<div><h4>Trupti Latur</h4><p>${input.value}</p></div>
`;
list.prepend(div);
input.value = "";
showToast("Comment added");
}

document.getElementById("commentInput").addEventListener("keydown",e=>{
if(e.key === "Enter") sendComment();
});

function openModal(id){
document.getElementById(id).classList.add("show");
}

function closeModal(id){
document.getElementById(id).classList.remove("show");
}

document.querySelectorAll(".modal-bg").forEach(m=>{
m.addEventListener("click",e=>{
if(e.target === m) m.classList.remove("show");
});
});

function shareToast(type){
showToast("Shared on " + type);
closeModal("shareModal");
}

function copyLink(){
navigator.clipboard.writeText(window.location.href);
showToast("Link copied");
closeModal("shareModal");
}

function nativeShare(){
if(navigator.share){
navigator.share({
title:"JioVibe Short",
text:"Watch this short on JioVibe",
url:window.location.href
});
}else{
showToast("More share options not supported here");
}
}

function showToast(text){
const toast = document.getElementById("toast");
toast.innerText = text;
toast.classList.add("show");
setTimeout(()=>toast.classList.remove("show"),1600);
}

document.addEventListener("keydown",function(e){
if(document.getElementById("playerMode").classList.contains("show")){
if(e.key==="Escape") closePlayer();
}
});

renderFeed();
</script>
