<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JioVibe Shorts</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#fff;color:#222}
.app{display:flex}

/* SIDEBAR */
.sidebar{
width:250px;
height:100vh;
border-right:1px solid #edf0f4;
padding:30px 18px;
background:#fff;
position:fixed;
}
.logo{display:flex;align-items:center;margin-bottom:40px}
.logo-circle{
width:50px;height:50px;border-radius:50%;
background:#ff5a00;color:#fff;
display:flex;align-items:center;justify-content:center;
font-weight:800;
}
.logo-text{font-size:28px;font-weight:800;margin-left:6px}
.menu{display:flex;flex-direction:column;gap:10px}
.menu-item{
padding:14px 18px;border-radius:12px;
font-weight:600;color:#333;display:flex;gap:12px;align-items:center
}
.menu-item.active{background:#ff5a00;color:#fff}

/* MAIN */
.main{margin-left:250px;width:100%}

/* TOPBAR */
.topbar{
height:80px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 40px;
border-bottom:1px solid #edf0f4;
background:#fff;
position:sticky;
top:0;
z-index:10;
}
.search{
width:500px;height:46px;border:1px solid #eee;border-radius:30px;
display:flex;align-items:center;padding:0 18px;gap:10px;color:#aaa;
}
.search input{border:none;outline:none;width:100%}

.top-actions{
display:flex;
align-items:center;
gap:20px;
position:relative;
}

.bell{
font-size:20px;
position:relative;
}
.bell::after{
content:"1";
position:absolute;
top:-6px;
right:-6px;
background:#ff5a00;
color:#fff;
font-size:10px;
width:16px;
height:16px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

.profile{
display:flex;
align-items:center;
gap:10px;
cursor:pointer;
}
.profile img{
width:40px;height:40px;border-radius:50%;
}
.profile span{font-weight:600}

.dropdown{
position:absolute;
top:60px;
right:0;
background:#fff;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
display:none;
}
.dropdown a{
display:block;padding:12px 16px;font-weight:600
}
.dropdown.show{display:block}

/* GRID */
.feed{
padding:30px;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:16px;
}
.card{
aspect-ratio:9/16;
border-radius:16px;
overflow:hidden;
cursor:pointer;
position:relative;
}
.card img{width:100%;height:100%;object-fit:cover}
.card span{
position:absolute;top:10px;left:10px;
background:rgba(0,0,0,.6);
color:#fff;padding:4px 8px;border-radius:6px;font-size:12px;
}

/* PLAYER */
.player{
position:fixed;
inset:0;
background:#000;
display:none;
z-index:50;
}
.player.show{display:flex;justify-content:center;align-items:center}

.reel{
height:90vh;
aspect-ratio:9/16;
position:relative;
}
.reel img{width:100%;height:100%;object-fit:cover}

.actions{
position:absolute;
right:-70px;
top:50%;
transform:translateY(-50%);
display:flex;
flex-direction:column;
gap:16px;
}
.action{
background:#fff;
width:55px;height:55px;
border-radius:12px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-size:14px;
}
.action.liked{color:#ff5a00}

.close{
position:absolute;
top:20px;
right:20px;
background:#fff;
border-radius:50%;
width:40px;height:40px;
display:flex;align-items:center;justify-content:center;
cursor:pointer;
}

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">
<div class="logo-circle">Jio</div>
<div class="logo-text">Vibe</div>
</div>

<div class="menu">
<div class="menu-item">🏠 Home</div>
<div class="menu-item">🧭 Explore</div>
<div class="menu-item">📡 Live</div>
<div class="menu-item">▶ Video</div>
<div class="menu-item active">⚡ Shorts</div>
<div class="menu-item">📃 Subscriptions</div>
<div class="menu-item">🕓 History</div>
<div class="menu-item">🔖 Saved Video</div>
</div>
</div>

<!-- MAIN -->
<div class="main">

<!-- TOPBAR -->
<div class="topbar">
<div class="search">
<i class="fa fa-search"></i>
<input placeholder="Search creators, videos, music...">
</div>

<div class="top-actions">
<div class="bell"><i class="fa-regular fa-bell"></i></div>

<div class="profile" onclick="toggleDropdown()">
<img src="https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/Trupti.jpeg">
<span>Trupti Latur</span>
<i class="fa-solid fa-chevron-down"></i>
</div>

<div class="dropdown" id="dropdown">
<a href="#">Home</a>
<a href="#">Dashboard</a>
<a href="#">Logout</a>
</div>
</div>
</div>

<!-- GRID -->
<div class="feed" id="feed"></div>

</div>
</div>

<!-- PLAYER -->
<div class="player" id="player">
<div class="reel" id="reel"></div>
<div class="close" onclick="closePlayer()">✖</div>
</div>

<script>
const data=[
"https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/S%20Narendra%20Modi.gif",
"https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/S%20Rohit%20Sharma.gif",
"https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/S%20Total%20Gaming.gif",
"https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/S%20Ashish%20Chanchlani.gif",
"https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/S%20Arijit%20Singh.gif",
"https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/S%20Technical%20Guruji.gif",
"https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/S%20Khan%20Sir.gif",
"https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/S%20Flying%20Beast.gif",
"https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/S%20Ranveer%20Singh.gif"
];

const feed=document.getElementById("feed");

data.forEach((gif,i)=>{
const div=document.createElement("div");
div.className="card";
div.innerHTML=`<img src="${gif}"><span>▶ ${Math.floor(Math.random()*3+1)}M</span>`;
div.onclick=()=>openPlayer(gif);
feed.appendChild(div);
});

function openPlayer(gif){
document.getElementById("player").classList.add("show");
document.getElementById("reel").innerHTML=`
<img src="${gif}">
<div class="actions">
<div class="action" onclick="like(this)">❤</div>
<div class="action">💬</div>
<div class="action">↗</div>
<div class="action">⋯</div>
</div>
`;
}

function closePlayer(){
document.getElementById("player").classList.remove("show");
}

function like(el){
el.classList.toggle("liked");
}

function toggleDropdown(){
document.getElementById("dropdown").classList.toggle("show");
}

document.addEventListener("click",(e)=>{
if(!e.target.closest(".profile")){
document.getElementById("dropdown").classList.remove("show");
}
});
</script>

</body>
</html>
