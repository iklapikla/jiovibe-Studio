<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JioVibe Shorts</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#f8f9fb;color:#202124;overflow:hidden}
a{text-decoration:none;color:inherit}
button,input{font-family:inherit}
button{border:none;background:none;cursor:pointer;color:inherit}

.app{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
width:250px;
height:100vh;
border-right:1px solid #edf0f4;
padding:32px 18px;
background:#fff;
z-index:10
}
.logo{display:flex;align-items:center;gap:4px;margin-bottom:45px;padding-left:8px}
.logo-circle{
width:54px;height:54px;background:#ff5a00;color:#fff;border-radius:50%;
display:flex;align-items:center;justify-content:center;font-weight:800;font-size:25px
}
.logo-text{font-size:32px;font-weight:800;color:#2b070b;letter-spacing:-1.2px}
.menu{display:flex;flex-direction:column;gap:12px}
.menu-item{
display:flex;align-items:center;gap:18px;padding:17px 22px;border-radius:14px;
font-weight:600;color:#383838;font-size:16px;transition:.25s
}
.menu-item i{width:22px;font-size:22px;text-align:center}
.menu-item:hover{background:#fff0e8;color:#ff5a00}
.menu-item.active{background:#ff5a00;color:#fff}

/* MAIN */
.main{flex:1;height:100vh;display:flex;flex-direction:column}
.topbar{
height:94px;
border-bottom:1px solid #edf0f4;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 48px;
background:#fff;
position:sticky;
top:0;
z-index:8
}
.search{
width:600px;
height:50px;
border:1px solid #e8ebf0;
border-radius:28px;
display:flex;
align-items:center;
gap:16px;
padding:0 22px;
color:#9ba1ad;
background:#fff
}
.search input{border:none;outline:none;flex:1;font-size:15px;background:transparent}
.top-actions{display:flex;align-items:center;gap:22px;position:relative}
.bell{
font-size:23px;
position:relative;
cursor:pointer;
}

.bell::after{
content:"1";
position:absolute;
top:-8px;
right:-7px;
background:#ff5a00;
color:#fff;
font-size:10px;
width:17px;
height:17px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

.profile{
display:flex;
align-items:center;
gap:12px;
cursor:pointer;
padding:8px;
border-radius:18px;
}

.profile img{
width:48px;
height:48px;
border-radius:50%;
object-fit:cover;
}

.profile span{
font-weight:700;
font-size:15px;
}

.dropdown{
position:absolute;
top:70px;
right:0;
width:200px;
background:#fff;
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
display:none;
overflow:hidden;
z-index:20;
}

.dropdown a{
display:block;
padding:14px;
font-weight:600;
color:#2f2f2f;
}

.dropdown a:hover{
background:#f1f3f4;
color:#111;
}

.dropdown.show{display:block;}

/* FEED */
.feed-home{
flex:1;
overflow-y:auto;
padding:28px 34px 50px;
background:#fbfbfc
}
.feed-title{margin-bottom:22px}
.feed-title h1{font-size:30px;font-weight:900}
.feed-title p{color:#777;font-weight:700;margin-top:5px}

.feed-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:18px
}
.feed-card{
width:100%;
aspect-ratio:9/16;
border-radius:20px;
overflow:hidden;
position:relative;
background:#000;
cursor:pointer;
box-shadow:0 10px 28px rgba(0,0,0,.10);
transition:.25s
}
.feed-card:hover{
box-shadow:0 18px 40px rgba(0,0,0,.16)
}
.feed-card img{
width:100%;
height:100%;
object-fit:cover;
display:block
}
.feed-card:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.72))
}
.feed-card .views{
position:absolute;
top:12px;
left:12px;
background:rgba(0,0,0,.60);
color:#fff;
padding:7px 10px;
border-radius:9px;
font-size:12px;
font-weight:900;
z-index:2
}
.feed-card .feed-info{
position:absolute;
left:14px;
right:14px;
bottom:14px;
color:#fff;
z-index:2
}
.feed-info h3{
font-size:15px;
line-height:1.35;
margin-bottom:7px;
font-weight:900
}
.feed-info p{
font-size:12px;
color:#eee;
font-weight:700
}

/* PLAYER */
.player-mode{
position:fixed;
inset:0;
background:#fbfbfc;
z-index:60;
display:none
}
.player-mode.show{display:block}

.close-player{
position:fixed;
top:22px;
right:28px;
width:48px;
height:48px;
border-radius:50%;
background:#fff;
color:#ff5a00;
box-shadow:0 8px 28px rgba(0,0,0,.15);
z-index:90;
font-size:22px
}

.short-scroll{
height:100vh;
overflow-y:auto;
scroll-snap-type:y mandatory;
scroll-behavior:smooth;
scrollbar-width:none;
display:flex;
flex-direction:column;
align-items:center;
padding:18px 0
}
.short-scroll::-webkit-scrollbar{display:none}

.short-item{
height:100vh;
width:720px;
max-width:96vw;
position:relative;
scroll-snap-align:start;
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0
}

.phone{
height:calc(100vh - 36px);
aspect-ratio:9/16;
max-height:940px;
border-radius:24px;
overflow:hidden;
position:relative;
background:#000;
box-shadow:0 24px 55px rgba(0,0,0,.20)
}
.phone img{
width:100%;
height:100%;
object-fit:cover;
display:block
}
.phone::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.06) 45%,rgba(0,0,0,.72));
pointer-events:none
}
.mute{
position:absolute;
top:18px;
right:18px;
width:44px;
height:44px;
background:rgba(0,0,0,.45);
color:#fff;
border-radius:50%;
z-index:3;
font-size:18px
}

.short-info{
position:absolute;
left:24px;
right:24px;
bottom:38px;
z-index:4;
color:#fff
}
.creator-line{
display:flex;
align-items:center;
gap:10px;
margin-bottom:16px
}
.creator-line img{
width:42px;
height:42px;
border-radius:50%;
object-fit:cover;
border:2px solid #fff
}
.creator-line b{font-size:15px}
.verify{color:#ff5a00}
.follow-btn{
margin-left:auto;
border:1px solid #ff5a00;
background:rgba(0,0,0,.25);
color:#fff;
border-radius:20px;
padding:9px 18px;
font-weight:900
}
.follow-btn.following{
background:#fff;
color:#333;
border-color:#fff
}
.caption{font-size:15px;line-height:1.5;margin-bottom:8px;font-weight:800}
.tags{font-size:14px;font-weight:900;color:#ff5a00}

.short-progress{
position:absolute;
left:24px;
right:24px;
bottom:22px;
height:4px;
background:rgba(255,255,255,.35);
border-radius:10px;
z-index:4
}
.short-progress span{
display:block;
height:100%;
width:40%;
background:#ff5a00;
border-radius:10px
}
.time{
position:absolute;
right:24px;
bottom:10px;
color:#fff;
font-size:13px;
font-weight:800;
z-index:4
}

/* ACTION BUTTONS */
.actions{
position:absolute;
right:0;
transform:translateX(88px);
top:50%;
margin-top:-150px;
display:flex;
flex-direction:column;
gap:18px
}
.action{
width:66px;
min-height:66px;
border-radius:14px;
background:#fff;
box-shadow:0 8px 28px rgba(0,0,0,.10);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:6px;
font-weight:900;
color:#555
}
.action i{font-size:24px}
.action span{font-size:12px}
.action:hover{background:#fff0e8;color:#ff5a00}
.action.liked{background:#ff5a00;color:#fff}

.more-menu{
display:none;
position:absolute;
right:-250px;
top:70%;
width:220px;
background:#fff;
border:1px solid #edf0f4;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,.16);
z-index:30;
overflow:hidden
}
.more-menu.show{display:block}
.more-menu div{
padding:14px 16px;
font-size:14px;
font-weight:800;
cursor:pointer
}
.more-menu div:hover{
background:#fff0e8;
color:#ff5a00
}

/* COMMENT PANEL FIXED */
.comment-panel{
position:fixed;
right:36px;
top:50%;
transform:translateY(-50%);
width:390px;
height:560px;
background:#fff;
border:1px solid #e8ebf0;
border-radius:20px;
box-shadow:0 24px 60px rgba(0,0,0,.20);
z-index:130;
display:none;
flex-direction:column;
overflow:hidden
}
.comment-panel.show{display:flex}
.comment-head{
height:60px;
border-bottom:1px solid #edf0f4;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
flex-shrink:0
}
.comment-head h3{font-size:18px;font-weight:900}
.comment-list{
flex:1;
overflow:auto;
padding:16px;
display:flex;
flex-direction:column;
gap:14px
}
.comment{
display:grid;
grid-template-columns:38px 1fr;
gap:10px
}
.comment img{
width:36px;
height:36px;
border-radius:50%;
object-fit:cover
}
.comment h4{font-size:13px;font-weight:900}
.comment p{font-size:13px;color:#4b5563;font-weight:600;margin-top:3px}
.comment-input{
border-top:1px solid #edf0f4;
padding:12px;
display:flex;
gap:8px;
flex-shrink:0
}
.comment-input input{
flex:1;
height:42px;
border:1px solid #e8ebf0;
border-radius:22px;
padding:0 14px;
outline:none;
font-weight:700
}
.send{
width:42px;
height:42px;
border-radius:50%;
background:#ff5a00;
color:#fff;
font-size:16px
}

/* SHARE MODAL */
.modal-bg{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
align-items:center;
justify-content:center;
z-index:140
}
.modal-bg.show{display:flex}
.modal{
background:#fff;
width:420px;
border-radius:20px;
padding:24px;
box-shadow:0 15px 45px rgba(0,0,0,.25)
}
.modal h2{margin-bottom:18px;font-size:22px;font-weight:900}
.close{
margin-top:18px;
width:100%;
height:46px;
border-radius:12px;
background:#f1f1f1;
font-weight:900
}
.share-icons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px
}
.share-icon{
text-align:center;
font-size:13px;
font-weight:800;
cursor:pointer
}
.share-icon i{
width:54px;
height:54px;
border-radius:50%;
background:#fff0e8;
color:#ff5a00;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
margin:0 auto 8px
}

.toast{
position:fixed;
top:24px;
left:50%;
transform:translateX(-50%) translateY(-20px);
background:#202124;
color:#fff;
padding:13px 18px;
border-radius:12px;
font-weight:900;
opacity:0;
transition:.25s;
z-index:200
}
.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0)
}

@media(max-width:1200px){
.feed-grid{grid-template-columns:repeat(4,1fr)}
.search{width:420px}
}
@media(max-width:1000px){
.sidebar{width:220px}
.feed-grid{grid-template-columns:repeat(3,1fr)}
.actions{transform:translateX(78px)}
}
@media(max-width:780px){
.sidebar{display:none}
.topbar{padding:0 16px}
.profile span{display:none}
.search{width:100%}
.feed-home{padding:20px}
.feed-grid{grid-template-columns:repeat(2,1fr);gap:14px}
.short-item{width:100%;height:100vh;max-width:100%}
.phone{width:100%;height:100%;border-radius:0;max-height:none}
.actions{right:16px;top:auto;bottom:120px;transform:none;margin-top:0;z-index:5}
.action{background:rgba(255,255,255,.92)}
.close-player{top:18px;right:18px}
.comment-panel{right:14px;left:14px;top:50%;width:auto}
.more-menu{right:20px;top:auto;bottom:105px}
}
</style>
</head>

<!-- COMMENT PANEL -->

<!-- SHARE MODAL -->

<div class="share-icon" onclick="shareToast('Telegram')"><i class="fa-brands fa-telegram"></i>Telegram</div>
<div class="share-icon" onclick="copyLink()"><i class="fa-solid fa-link"></i>Copy Link</div>
<div class="share-icon" onclick="shareToast('Email')"><i class="fa-solid fa-envelope"></i>Email</div>
<div class="share-icon" onclick="nativeShare()"><i class="fa-solid fa-ellipsis"></i>More</div>
</div>

<button class="close" onclick="closeModal('shareModal')">Close</button>
</div>
</div>

<script>

}

document.addEventListener("click",function(e){
if(!e.target.closest(".profile")){
document.getElementById("dropdown").classList.remove("show");
}
});

let feedMultiplier = 4;

function renderFeed(){
const grid = document.getElementById("feedGrid");
grid.innerHTML = "";

for(let round=0; round<feedMultiplier; round++){
shortsData.forEach((item,index)=>{
const card = document.createElement("div");
card.className = "feed-card";
card.onclick = () => openPlayer(index);
card.innerHTML = `
<img src="${item.gif}">
<span class="views"><i class="fa-solid fa-play"></i> ${item.views}</span>
<div class="feed-info">
<h3>${item.caption}</h3>
<p>${item.creator}</p>
</div>
`;
grid.appendChild(card);
});
}
}

function createShortItem(item,index){
const wrap = document.createElement("div");
wrap.className = "short-item";

wrap.innerHTML = `
<div class="phone">
<img src="${item.gif}">
<button class="mute" onclick="toggleMute(this)"><i class="fa-solid fa-volume-xmark"></i></button>

<div class="short-info">
<div class="creator-line">
<img src="${item.avatar}">
<b>${item.creator} <span class="verify"><i class="fa-solid fa-certificate"></i></span></b>
<button class="follow-btn" onclick="toggleFollow(this)">Subscribe</button>
</div>
<div class="caption">${item.caption}</div>
<div class="tags">${item.tags}</div>
</div>

<div class="short-progress"><span style="width:${35 + (index % 5) * 10}%"></span></div>
<div class="time">00:${String(8 + (index % 15)).padStart(2,"0")} / 00:25</div>
</div>

<div class="actions">
<button class="action like" onclick="toggleLike(this)"><i class="fa-solid fa-heart"></i><span>${item.likes}</span></button>
<button class="action" onclick="openComments()"><i class="fa-regular fa-comment-dots"></i><span>${item.comments}</span></button>
<button class="action" onclick="openModal('shareModal')"><i class="fa-solid fa-share"></i><span>${item.shares}</span></button>
<button class="action" onclick="toggleMoreMenu(this)"><i class="fa-solid fa-ellipsis"></i></button>
</div>

<div class="more-menu">
<div onclick="showToast('Short saved')"><i class="fa-regular fa-bookmark"></i> Save short</div>
<div onclick="showToast('Added to playlist')"><i class="fa-solid fa-list"></i> Add to playlist</div>
<div onclick="showToast('Marked as not interested')"><i class="fa-regular fa-eye-slash"></i> Not interested</div>
<div onclick="showToast('Report submitted')"><i class="fa-regular fa-flag"></i> Report</div>
</div>
`;

return wrap;
}

function openPlayer(index){
const player = document.getElementById("playerMode");
const scroll = document.getElementById("shortScroll");
scroll.innerHTML = "";

let playerList = [];
for(let i=0;i<40;i++){
playerList.push(shortsData[(index+i)%shortsData.length]);
}

playerList.forEach((item,i)=>{
scroll.appendChild(createShortItem(item,i));
});

player.classList.add("show");

setTimeout(()=>{
scroll.scrollTop = 0;
},50);
}

function closePlayer(){
document.getElementById("playerMode").classList.remove("show");
document.getElementById("shortScroll").innerHTML = "";
closeComments();
closeModal("shareModal");
}

function toggleLike(btn){
btn.classList.toggle("liked");
const span = btn.querySelector("span");
if(!btn.dataset.base) btn.dataset.base = span.innerText;
span.innerText = btn.classList.contains("liked") ? "Liked" : btn.dataset.base;
}

function toggleFollow(btn){
btn.classList.toggle("following");
btn.innerText = btn.classList.contains("following") ? "Subscribed" : "Subscribe";
}

function toggleMute(btn){
const icon = btn.querySelector("i");
icon.classList.toggle("fa-volume-xmark");
icon.classList.toggle("fa-volume-high");
showToast(icon.classList.contains("fa-volume-high") ? "Unmuted" : "Muted");
}

function toggleMoreMenu(btn){
const menu = btn.closest(".short-item").querySelector(".more-menu");
document.querySelectorAll(".more-menu").forEach(m=>{
if(m !== menu) m.classList.remove("show");
});
menu.classList.toggle("show");
}

document.getElementById("feedHome").addEventListener("scroll", function(){
if(this.scrollTop + this.clientHeight >= this.scrollHeight - 300){
feedMultiplier++;
renderFeed();
}
});

document.getElementById("shortScroll").addEventListener("scroll", function(){
if(this.scrollTop + this.clientHeight >= this.scrollHeight - 500){
for(let i=0;i<8;i++){
const item = shortsData[Math.floor(Math.random()*shortsData.length)];
this.appendChild(createShortItem(item,this.children.length));
}
}
});

document.addEventListener("click",function(e){
if(!e.target.closest(".action") && !e.target.closest(".more-menu")){
document.querySelectorAll(".more-menu").forEach(m=>m.classList.remove("show"));
}
});

function openComments(){
renderComments();
document.getElementById("commentPanel").classList.add("show");
}

function closeComments(){
document.getElementById("commentPanel").classList.remove("show");
}

function renderComments(){
const comments = [
["Rohan","This is so good 🔥","https://i.pravatar.cc/80?img=11"],
["Priya","Vibe is perfect","https://i.pravatar.cc/80?img=18"],
["Amit","Watched it 5 times already","https://i.pravatar.cc/80?img=24"],
["Mumbai Vibes","JioVibe shorts look clean","https://i.pravatar.cc/80?img=32"]
];

document.getElementById("commentList").innerHTML = comments.map(c=>`
<div class="comment">
<img src="${c[2]}">
<div><h4>${c[0]}</h4><p>${c[1]}</p></div>
</div>
`).join("");
}

function sendComment(){
const input = document.getElementById("commentInput");
if(input.value.trim() === "") return;

const list = document.getElementById("commentList");
const div = document.createElement("div");
div.className = "comment";
div.innerHTML = `
<img src="https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/Trupti.jpeg">
<div><h4>Trupti Latur</h4><p>${input.value}</p></div>
`;
list.prepend(div);
input.value = "";
showToast("Comment added");
}

document.getElementById("commentInput").addEventListener("keydown",e=>{
if(e.key === "Enter") sendComment();
});

function openModal(id){
document.getElementById(id).classList.add("show");
}

function closeModal(id){
document.getElementById(id).classList.remove("show");
}

document.querySelectorAll(".modal-bg").forEach(m=>{
m.addEventListener("click",e=>{
if(e.target === m) m.classList.remove("show");
});
});

function shareToast(type){
showToast("Shared on " + type);
closeModal("shareModal");
}

function copyLink(){
navigator.clipboard.writeText(window.location.href);
showToast("Link copied");
closeModal("shareModal");
}

function nativeShare(){
if(navigator.share){
navigator.share({
title:"JioVibe Short",
text:"Watch this short on JioVibe",
url:window.location.href
});
}else{
showToast("More share options not supported here");
}
}

function showToast(text){
const toast = document.getElementById("toast");
toast.innerText = text;
toast.classList.add("show");
setTimeout(()=>toast.classList.remove("show"),1600);
}

document.addEventListener("keydown",function(e){
if(document.getElementById("playerMode").classList.contains("show")){
if(e.key==="Escape") closePlayer();
}
});

renderFeed();
</script>

</body>
</html>
