<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JioVibe AI Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:#fff;color:#1f1f1f;}

a{text-decoration:none;color:inherit;} /* 🔥 important fix */

.app{display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{
width:250px;
padding:32px 18px;
position:fixed;
height:100%;
background:#fff;
}

.logo{
display:flex;
align-items:center;
gap:4px;
margin-bottom:45px;
padding-left:8px;
}

.logo-circle{
width:54px;height:54px;background:#ff5a00;color:#fff;
border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-weight:800;font-size:25px;
}

.logo-text{
font-size:32px;
font-weight:800;
letter-spacing:-1.2px;
}

.menu{display:flex;flex-direction:column;gap:12px;}

.menu-item{
display:flex;
align-items:center;
gap:18px;
padding:17px 22px;
border-radius:14px;
font-weight:600;
font-size:16px;
color:#383838;
transition:.25s;
}

.menu-item i{width:22px;font-size:22px;text-align:center;}

.menu-item:hover,.menu-item.active{
background:#fff0e8;
color:#ff5a00;
}

/* MAIN */
.main{
margin-left:250px;
width:calc(100% - 250px);
}

/* TOPBAR */
.topbar{
height:94px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 48px;
background:#fff;
position:sticky;
top:0;
}

.search{
width:600px;
height:50px;
border:1px solid #e8ebf0;
border-radius:28px;
display:flex;
align-items:center;
gap:16px;
padding:0 22px;
color:#9ba1ad;
box-shadow:0 1px 6px rgba(0,0,0,0.03);
}

.search input{
border:none;outline:none;flex:1;font-size:15px;
}

.top-actions{
display:flex;
align-items:center;
gap:22px;
position:relative;
}

.bell{
font-size:23px;
position:relative;
cursor:pointer;
}

.bell::after{
content:"1";
position:absolute;
top:-8px;
right:-7px;
background:#ff5a00;
color:#fff;
font-size:10px;
width:17px;height:17px;
border-radius:50%;
display:flex;align-items:center;justify-content:center;
}

/* PROFILE */
.profile{
display:flex;
align-items:center;
gap:12px;
cursor:pointer;
padding:8px;
border-radius:18px;
}

.profile img{
width:48px;height:48px;border-radius:50%;
}

.profile span{font-weight:700;font-size:15px;}

.dropdown{
position:absolute;
top:70px;
right:0;
width:200px;
background:#fff;
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
display:none;
overflow:hidden;
}

.dropdown a{
display:block;
padding:14px;
font-weight:600;
color:#2f2f2f;
}

.dropdown a:hover{
background:#fff0e8;
color:#ff5a00;
}

.dropdown.show{display:block;}

.content{padding:40px;}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">
<div class="logo">
<div class="logo-circle">Jio</div>
<div class="logo-text">Vibe</div>
</div>

<nav class="menu">
<a href="index.html" class="menu-item active"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a>
<a href="content.html" class="menu-item"><i class="fa-regular fa-circle-play"></i> Content</a>
<a href="analytics.html" class="menu-item"><i class="fa-solid fa-chart-line"></i> Analytics</a>
<a href="community.html" class="menu-item"><i class="fa-regular fa-comments"></i> Community Post</a>
<a href="stories.html" class="menu-item"><i class="fa-regular fa-circle"></i> Stories</a>
<a href="ai-studio.html" class="menu-item"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Studio</a>
<a href="wallet.html" class="menu-item"><i class="fa-solid fa-wallet"></i> Wallet</a>
<a href="settings.html" class="menu-item"><i class="fa-solid fa-gear"></i> Settings</a>
</nav>
</aside>

<!-- MAIN -->
<main class="main">

<header class="topbar">

<div class="search">
<i class="fa-solid fa-magnifying-glass"></i>
<input type="text" placeholder="Search creators, analytics..." />
</div>

<div class="top-actions">

<div class="bell">
<i class="fa-regular fa-bell"></i>
</div>

<div class="profile" onclick="toggleDropdown()">
<img src="https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/Ankit.jpeg">
<span>Ankit Jayant</span>
<i class="fa-solid fa-chevron-down"></i>
</div>

<div class="dropdown" id="dropdown">
<a href="home.html">Home</a>
<a href="index.html">Dashboard</a>
<a href="logout.html">Sign out</a>
</div>

</div>
</header>

<div class="content"></div>
  
</main>
</div>

<script>
function toggleDropdown(){
document.getElementById("dropdown").classList.toggle("show");
}
document.addEventListener("click",function(e){
if(!e.target.closest(".profile")){
document.getElementById("dropdown").classList.remove("show");
}
});
</script>

</body>
</html>
