<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JioVibe</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:#f8f9fb;color:#202124;}
a{text-decoration:none;color:inherit;}

.app{display:flex;min-height:100vh;}

/* ===== SIDEBAR (UNCHANGED) ===== */
.sidebar{
width:250px;
padding:32px 18px;
position:fixed;
height:100%;
background:#fff;
border-right:1px solid #edf0f4;
}

.logo{
display:flex;
align-items:center;
gap:4px;
margin-bottom:45px;
padding-left:8px;
}

.logo-circle{
width:54px;height:54px;background:#ff5a00;color:#fff;
border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-weight:800;font-size:25px;
}

.logo-text{
font-size:32px;
font-weight:800;
letter-spacing:-1.2px;
color:#2b070b;
}

.menu{display:flex;flex-direction:column;gap:12px;}

.menu-item{
display:flex;
align-items:center;
gap:18px;
padding:17px 22px;
border-radius:14px;
font-weight:600;
font-size:16px;
color:#383838;
transition:.25s;
}

.menu-item i{width:22px;font-size:22px;text-align:center;}

.menu-item:hover,.menu-item.active{
background:#f1f3f4;
color:#111;
}

/* ===== MAIN ===== */
.main{
margin-left:250px;
width:calc(100% - 250px);
}

/* ===== TOPBAR (UNCHANGED) ===== */
.topbar{
height:94px;
border-bottom:1px solid #edf0f4;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 48px;
background:#fff;
position:sticky;
top:0;
z-index:8;
}

.search{
width:600px;
height:50px;
border:1px solid #e8ebf0;
border-radius:28px;
display:flex;
align-items:center;
gap:16px;
padding:0 22px;
color:#9ba1ad;
background:#fff;
}

.search input{
border:none;
outline:none;
flex:1;
font-size:15px;
color:#333;
}

.top-actions{
display:flex;
align-items:center;
gap:22px;
position:relative;
}

.bell{
font-size:23px;
position:relative;
cursor:pointer;
}

.bell::after{
content:"1";
position:absolute;
top:-8px;
right:-7px;
background:#ff5a00;
color:#fff;
font-size:10px;
width:17px;
height:17px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

.profile{
display:flex;
align-items:center;
gap:12px;
cursor:pointer;
padding:8px;
border-radius:18px;
}

.profile img{
width:48px;
height:48px;
border-radius:50%;
object-fit:cover;
}

.profile span{
font-weight:700;
font-size:15px;
}

.dropdown{
position:absolute;
top:70px;
right:0;
width:200px;
background:#fff;
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
display:none;
overflow:hidden;
z-index:20;
}

.dropdown a{
display:block;
padding:14px;
font-weight:600;
color:#2f2f2f;
}

.dropdown a:hover{
background:#f1f3f4;
color:#111;
}

.dropdown.show{display:block;}

/* ===== EMPTY CONTENT AREA ===== */
.content{
padding:36px 48px;
}

/* (abhi empty hai - tum baad me add karoge) */

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">
<a href="index.html" class="logo">
<div class="logo-circle">Jio</div>
<div class="logo-text">Vibe</div>
</a>

<nav class="menu">
<a href="home.html" class="menu-item active"><i class="fa-solid fa-house"></i> Home</a>
<a href="explore.html" class="menu-item"><i class="fa-regular fa-compass"></i> Explore</a>
<a href="live.html" class="menu-item"><i class="fa-solid fa-tower-broadcast"></i> Live</a>
<a href="video.html" class="menu-item"><i class="fa-regular fa-circle-play"></i> Video</a>
<a href="shorts.html" class="menu-item"><i class="fa-solid fa-bolt"></i> Shorts</a>
<a href="subscriptions.html" class="menu-item"><i class="fa-solid fa-list"></i> Subscriptions</a>
<a href="history.html" class="menu-item"><i class="fa-solid fa-clock"></i> History</a>
<a href="saved.html" class="menu-item"><i class="fa-solid fa-bookmark"></i> Saved Video</a>
</nav>
</aside>

<!-- MAIN -->
<main class="main">

<header class="topbar">
<div class="search">
<i class="fa-solid fa-magnifying-glass"></i>
<input type="text" placeholder="Search creators, videos, topics..." />
</div>

<div class="top-actions">
<div class="bell"><i class="fa-regular fa-bell"></i></div>

<div class="profile" onclick="toggleDropdown()">
<img src="https://raw.githubusercontent.com/iklapikla/jiovibe-Studio/refs/heads/main/Trupti.jpeg">
<span>Trupti Latur</span>
<i class="fa-solid fa-chevron-down"></i>
</div>

<div class="dropdown" id="dropdown">
<a href="home.html">Home</a>
<a href="index.html">Dashboard</a>
<a href="logout.html">Sign out</a>
</div>
</div>
</header>

<!-- EMPTY CONTENT -->
<section class="content">
<!-- yaha se tum next changes add karoge -->
</section>

</main>
</div>

<script>
function toggleDropdown(){
document.getElementById("dropdown").classList.toggle("show");
}

document.addEventListener("click",function(e){
if(!e.target.closest(".profile")){
document.getElementById("dropdown").classList.remove("show");
}
});
</script>

</body>
</html>
